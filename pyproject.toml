[project]
name = "kinyonga"
version = "0.1.0"
description = "One generator for Quarto documents in one brand: CV, book, slides and letter"
authors = [{ name = "sambaiga", email = "sambaiga@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
kinyonga = "kinyonga.cli:main"

[project.urls]
Homepage = "https://github.com/sambaiga/kinyonga"
Repository = "https://github.com/sambaiga/kinyonga"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinyonga"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "kinyonga/_data/profiles"
"_extensions" = "kinyonga/_data/_extensions"
"fonts" = "kinyonga/_data/fonts"
"assets" = "kinyonga/_data/assets"
"brand.yml" = "kinyonga/_data/brand.yml"
"kinyonga.yml" = "kinyonga/_data/kinyonga.yml"

[dependency-groups]
dev = [
    "quarto-cli>=1.11,<1.12",
    "types-pyyaml>=6.0",
    "fonttools>=4.50",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "commitizen>=4.0",
    "ruff>=0.14",
    "ty>=0.0.100",
    "prek>=0.2",
    "interrogate>=1.7",
    "bandit>=1.8",
    "deptry>=0.20",
    "diff-cover>=9.0",
]

[tool.uv]
required-version = ">=0.9"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=kinyonga --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -m 'not render'"
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "unit: fast tests of one function or class",
    "integration: tests that cross modules or touch files",
    "slow: tests that take more than a few seconds (deselect with -m 'not slow')",
    "render: tests that render documents with the pinned Quarto (run by `make verify`)",
]

[tool.coverage.run]
branch = true
source = ["kinyonga"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "B", "C4", "C901", "D", "E", "F", "I", "N", "NPY", "PD", "PERF", "PGH", "PLR0912", "PLR0915", "PTH", "Q", "RUF",
    "S", "SIM", "T201", "TID", "TRY", "UP", "W", "YTT",
]
ignore = ["D105", "D107", "TRY003", "N803"]

# Size and complexity limits: split a function that needs more.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "T201", "C901", "PLR0912", "PLR0915"]
"scripts/**" = ["T201", "S603", "S607"]
# The generator runs git, and the render test runs uv, make and poppler: that is their purpose; the commands are fixed lists.
"kinyonga/generate.py" = ["S603", "S607"]
"tests/unit/test_render.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["kinyonga"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["kinyonga", "tests", "scripts"]

[tool.deptry]
known_first_party = ["kinyonga"]

[tool.deptry.per_rule_ignores]
DEP004 = ["interrogate", "fontTools"]  # development tools: scripts/check_docstrings.py and scripts/branding/make_logos.py

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert statements
    "B404",  # subprocess import: informational only
    "B603",  # subprocess without shell=True with fixed argument lists
    "B607",  # partial executable path (git)
]

[tool.codespell]
skip = "*.ipynb,*.csv,*.json,*.ttf,*.pdf,*.svg,uv.lock,tokens,fonts,assets"
ignore-words = "codespell.ignore"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
version_scheme = "semver"
update_changelog_on_bump = true
style = "keepachangelog"
