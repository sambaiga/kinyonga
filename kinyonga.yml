# Settings of the kit itself (not read by Quarto). Text and background pairs that must meet WCAG AA contrast.
# Files of shared/ that an extension takes (the slides and the book share the takeaway bar, card and key number).
shared:
  kinyonga-slides: [_components.scss]
  kinyonga-book: [_components.scss]

contrast:
  - {text: ink, background: white, minimum: 4.5}
  - {text: ink-2, background: white, minimum: 4.5}
  - {text: slate, background: white, minimum: 4.5}
  - {text: blue, background: white, minimum: 4.5}
  - {text: blue-deep, background: blue-soft, minimum: 4.5}
  - {text: orange-ink, background: orange-soft, minimum: 4.5}
  - {text: white, background: blue, minimum: 4.5}
  - {text: white, background: ink, minimum: 4.5}
  - {text: white, background: blue-deep, minimum: 4.5}
  - {text: danger, background: white, minimum: 4.5}
  - {text: success, background: white, minimum: 3.0}
  - {text: rule, background: ink, minimum: 4.5}
  - {text: blue-soft, background: ink, minimum: 4.5}
  - {text: white, background: ink, minimum: 4.5}
