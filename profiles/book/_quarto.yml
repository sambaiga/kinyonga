# A Quarto book. `make book` renders the web edition (HTML) and the print edition (LaTeX); `make review` renders the
# fast Typst edition into its own folder, because both PDF editions would otherwise write the same file name.
project:
  type: book
  output-dir: rendered_output
  brand: brand.yml

metadata-files:
  - profile.yml

book:
  title: Sample Book
  subtitle: A book in the kinyonga brand
  author: Sample Author
  chapters:
    - index.qmd
    - ch1.qmd
    - ch2.qmd
    - references.qmd

bibliography: references.bib

format:
  kinyonga-book-html: default
  kinyonga-book-pdf: default

execute:
  freeze: auto
  warning: false
