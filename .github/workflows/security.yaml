name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency CVE scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"


      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement <(uv export --no-dev --format requirements-txt | grep -v "^-e \|file://") --strict

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Audit the workflows
        run: uvx zizmor --offline .github/workflows

  # bandit and detect-secrets are covered by hooks on every commit.
