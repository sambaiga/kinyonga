# kinyonga brand: the single source of every colour, font and logo in the kit.
# Quarto >= 1.6 reads this file natively (Typst, HTML, reveal.js). `kinyonga sync` turns it into the token files
# that LaTeX, SCSS and CSS need and copies it into every extension; `kinyonga check` fails if any copy differs.
meta:
  name:
    full: kinyonga
    short: kinyonga

logo:
  images:
    kinyonga-mark:
      path: assets/mark.svg
      alt: kinyonga
    kinyonga-logo:
      path: assets/logo.svg
      alt: kinyonga
    kinyonga-logo-dark:
      path: assets/logo-dark.svg
      alt: kinyonga
  small: kinyonga-mark
  medium:
    light: kinyonga-logo
    dark: kinyonga-logo-dark

color:
  palette:
    white: "#FFFFFF"
    ink: "#1E293B"
    ink-2: "#334155"
    slate: "#64748B"
    slate-light: "#94A3B8"
    rule: "#E2E8F0"
    panel: "#F8FAFC"
    blue: "#0369A1"
    blue-deep: "#0C4A6E"
    blue-soft: "#E8F2F8"
    orange: "#E26029"
    orange-ink: "#A94A1E"
    orange-soft: "#FBEBE4"
    success: "#059669"
    danger: "#DC2626"
  foreground: ink
  background: white
  primary: blue
  secondary: slate
  success: success
  info: blue
  warning: orange
  danger: danger
  light: panel
  dark: ink
  link: blue

typography:
  fonts:
    - family: Jost
      source: file
      files:
        - path: fonts/Jost-SemiBold.ttf
          weight: 600
          style: normal
        - path: fonts/Jost-Bold.ttf
          weight: 700
          style: normal
    - family: Libre Franklin
      source: file
      files:
        - path: fonts/LibreFranklin-Regular.ttf
          weight: 400
          style: normal
        - path: fonts/LibreFranklin-Italic.ttf
          weight: 400
          style: italic
        - path: fonts/LibreFranklin-SemiBold.ttf
          weight: 600
          style: normal
        - path: fonts/LibreFranklin-SemiBoldItalic.ttf
          weight: 600
          style: italic
  base:
    family: Libre Franklin
    weight: 400
  headings:
    family: Jost
    weight: 600
